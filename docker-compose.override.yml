# Основной стенд: бэкенд ещё и прямым портом, для десктопного приложения.
# Окно приложения не доверяет самоподписанному корню Caddy и через
# https://localhost к API не дойдёт (docs/backlog.md, «Приложение не открывает
# основной стенд за Caddy»).
#
# Docker Compose подхватывает этот файл сам, только когда -f не указан, — то
# есть ровно при запуске основного стенда. Личные стенды поднимаются с явными
# -f docker-compose.yml -f docker-compose.stand.yml и его не видят, иначе два
# стенда спорили бы за один порт. Порт открыт только на этой машине.
services:
  backend:
    ports:
      - "127.0.0.1:8800:8000"

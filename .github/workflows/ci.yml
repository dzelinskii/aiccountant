name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run python scripts/gen_reference.py
      - name: Справочник не разошёлся с кодом
        run: |
          # --intent-to-add обязателен: git diff неотслеживаемые файлы не видит,
          # и новый файл от нового генератора прошёл бы сверку молча
          git -C .. add --intent-to-add docs/reference/generated
          if ! git -C .. diff --exit-code -- docs/reference/generated; then
            echo ""
            echo "Генерируемая часть справочника устарела."
            echo "Запустите: cd backend && uv run python scripts/gen_reference.py"
            echo "и закоммитьте изменения в docs/reference/generated."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: collector/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: collector/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm reference
      - name: Справочник не разошёлся с кодом
        run: |
          # --intent-to-add обязателен: git diff неотслеживаемые файлы не видит,
          # и новый файл от нового генератора прошёл бы сверку молча
          git -C .. add --intent-to-add docs/reference/generated
          if ! git -C .. diff --exit-code -- docs/reference/generated; then
            echo ""
            echo "Генерируемая часть справочника устарела."
            echo "Запустите: cd collector && pnpm reference"
            echo "и закоммитьте изменения в docs/reference/generated."
            exit 1
          fi

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # generate_context! читает собранный фронт при компиляции
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      # живые тесты (хранилище ОС, сеть) помечены #[ignore] и здесь не идут
      - run: cargo test
        working-directory: desktop/src-tauri

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build

  docs-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # только на PR: у push в main нет ни базы для сравнения, ни метки-исключения
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'docs-not-needed')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Правка контракта требует правки справочника
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          # Тесты отсеиваем отдельным шагом: коллектор держит их рядом с кодом,
          # и без этого правка collector/src/core/*.test.ts требовала бы правки
          # справочника. Ложные срабатывания опаснее пропусков — от них ворота
          # начинают обходить бессмысленной правкой документа
          contract=$(echo "$changed" | grep -E '^(backend/app/[^/]+/service\.py|backend/app/core/|collector/src/core/|collector/src/plugins/[^/]+/map\.ts|desktop/src-tauri/src/(banks|secrets|windows|http)\.rs)' | grep -vE '\.test\.ts$' || true)
          touched_docs=$(echo "$changed" | grep -E '^docs/reference/' || true)
          if [ -n "$contract" ] && [ -z "$touched_docs" ]; then
            echo "Изменились файлы, несущие контракт:"
            echo "$contract"
            echo ""
            echo "Справочник в docs/reference/ не тронут."
            echo "Обновите нужный документ — либо поставьте на PR метку"
            echo "docs-not-needed, если правка действительно не меняет поведения."
            exit 1
          fi
          echo "Проверка пройдена."
